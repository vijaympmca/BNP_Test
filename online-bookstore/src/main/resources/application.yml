server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: online-bookstore
  datasource:
    url: jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Must be at least 32 characters (256 bits). Override in production with the JWT_SECRET env variable.
    secret: ${JWT_SECRET:change-me-to-a-long-random-256-bit-secret-key-for-bookstore}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  settings:
    max-page-size: 100
    slow-request-threshold-ms: 500
    cors-allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
      - http://localhost:5173
    seed:
      admin-username: admin
      admin-email: admin@bookstore.com
      admin-password: ${ADMIN_PASSWORD:Bookstore@2026}
      user-username: john_doe
      user-email: john.doe@bookstore.com
      user-password: ${USER_PASSWORD:Reader@2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.bookstore: INFO
